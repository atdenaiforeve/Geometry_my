<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Geometry_my</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" class="menu">
    <h1>GEOMETRY_MY</h1>
    <div class="loader"></div>
    <p id="loadingText">LOADING...</p>
  </div>

  <canvas id="game" aria-label="Geometry_my 2D game"></canvas>

  <div id="menu" class="menu hidden">
    <h1>GEOMETRY_MY</h1>
    <button id="play" type="button">PLAY</button>
  </div>

  <div id="levelMenu" class="menu hidden">
    <h2>LEVEL SELECT</h2>
    <button class="level" data-level="1" type="button">LEVEL 1 <span>BEST: 0% · FIRST FLIGHT</span></button>
    <button class="level" data-level="2" type="button">LEVEL 2 🔒 <span>LOCKED</span></button>
    <button id="back" type="button">BACK</button>
  </div>

  <script src="game.js"></script>
  <script>
    // Boot the game menu reliably even when the page is restored from cache.
    (() => {
      const loading = document.getElementById("loading");
      const menu = document.getElementById("menu");

      function showMainMenu() {
        loading.classList.add("hidden");
        menu.classList.remove("hidden");
        loading.style.display = "none";
        menu.style.display = "flex";
      }

      // Start the transition after the document is ready, rather than waiting
      // for every page resource to finish loading.
      const boot = () => setTimeout(showMainMenu, 700);

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
