<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Into the Nexus</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
  body{position:relative}
  .background{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:center;
    display:block;
    z-index:0;
  }
  .shade{
    position:fixed;inset:0;z-index:1;
    pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,.12),rgba(0,0,0,.22));
  }
  .menu{
    position:relative;z-index:2;
    width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;
    padding:max(8vh,36px) 20px max(7vh,28px);
  }
  .title{text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.7)}
  .title h1{margin:0;font-size:clamp(2.8rem,10vw,6rem);font-weight:900;letter-spacing:.12em}
  .title p{margin:.7rem 0 0;font-size:clamp(.75rem,2vw,1rem);letter-spacing:.28em;font-weight:600}
  .buttons{display:flex;flex-direction:column;gap:12px;width:min(340px,88vw)}
  .btn{
    min-height:56px;padding:0 22px;border:2px solid rgba(255,255,255,.82);
    border-radius:8px;background:rgba(0,0,0,.38);color:#fff;
    font:800 1rem Arial,Helvetica,sans-serif;letter-spacing:.18em;
    cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    transition:transform .12s ease,background .12s ease,box-shadow .12s ease;
  }
  .btn:hover{background:rgba(0,0,0,.58);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .btn-primary{min-height:62px;font-size:1.08rem}
  .toast{
    position:fixed;z-index:10;left:50%;bottom:24px;
    transform:translate(-50%,20px);padding:10px 18px;
    background:rgba(0,0,0,.8);border:1px solid #fff;border-radius:6px;
    font-size:.75rem;opacity:0;pointer-events:none;transition:.2s
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-height:620px){
    .menu{padding:24px 16px}
    .title h1{font-size:clamp(2.1rem,13vh,4rem)}
    .buttons{display:grid;grid-template-columns:1fr 1fr;width:min(560px,92vw);gap:9px}
    .btn,.btn-primary{min-height:48px;font-size:.78rem}
  }
</style>
</head>
<body>
<img class="background" src="assets/Gemini_Generated_Image_vbdhd0vbdhd0vbdh.jpeg" alt="" aria-hidden="true">
<div class="shade" aria-hidden="true"></div>

<main class="menu">
  <header class="title">
    <h1>INTO THE NEXUS</h1>
    <p>WHERE REALITIES MERGE</p>
  </header>

  <nav class="buttons" aria-label="Main menu">
    <button class="btn btn-primary" type="button" data-action="play">PLAY</button>
    <button class="btn" type="button" data-action="customize">CUSTOMIZE</button>
    <button class="btn" type="button" data-action="shop">SHOP</button>
    <button class="btn" type="button" data-action="level-maker">LEVEL MAKER</button>
  </nav>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const ACTIONS = {
    play(){ window.location.assign(new URL('game.html?screen=levels', location.href).href); },
    shop(){ window.location.assign(new URL('game.html?screen=shop', location.href).href); },
    customize(){ window.location.assign(new URL('game.html?screen=customize', location.href).href); },
    'level-maker'(){ window.location.assign(new URL('game.html?screen=maker', location.href).href); }
  };

  const buttons = [...document.querySelectorAll('[data-action]')];
  buttons.forEach(btn => btn.addEventListener('click', () => {
    const action = ACTIONS[btn.dataset.action];
    if(action) action();
  }));

  window.addEventListener('keydown', e => {
    const down = e.key === 'ArrowDown' || e.key === 's' || e.key === 'S';
    const up = e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W';
    if(!down && !up) return;
    e.preventDefault();
    const i = buttons.indexOf(document.activeElement);
    const next = i < 0 ? 0 : (i + (down ? 1 : -1) + buttons.length) % buttons.length;
    buttons[next].focus();
  });

  const toast = document.getElementById('toast');
  window.NexusMenu = {
    actions: ACTIONS,
    toast(message){
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.__nexusToastTimer);
      window.__nexusToastTimer = setTimeout(() => toast.classList.remove('show'),1800);
    }
  };
})();
</script>
</body>
</html>
