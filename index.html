<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Into the Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   INTO THE NEXUS - main menu styles
   Colours and the vortex position live in :root so they are
   easy to tweak. The vortex centre (50% / 52%) must match
   CX / CY in menu.js and the clip-path points below.
   ============================================================ */

:root {
  --cyan: #2ff3ff;
  --magenta: #ff2fd6;
  --violet: #8a4dff;
  --orange: #ff9a2f;
  --ink: #070b1a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--ink);
  color: #e8fbff;
  font-family: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
}

/* ---------- Realms ---------- */

.realm { position: absolute; inset: 0; }

/* Left: neon cyber-tech */
.cyber {
  clip-path: polygon(0 0, 40% 0, 50% 52%, 36% 100%, 0 100%);
  background:
    repeating-linear-gradient(0deg, rgba(47,243,255,.10) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(47,243,255,.10) 0 1px, transparent 1px 40px),
    linear-gradient(160deg, #04081a 0%, #0a1c48 55%, #0b2b66 100%);
}
.beam {
  position: absolute;
  height: 14px;
  background: linear-gradient(90deg, transparent, var(--cyan), #0b3d6e);
  box-shadow: 0 0 18px var(--cyan);
  transform-origin: left center;
  animation: beamPulse 3.2s ease-in-out infinite;
}
.b1 { left: 4%;  top: 22%; width: 38%; transform: rotate(24deg); }
.b2 { left: 0;   top: 12%; width: 30%; transform: rotate(8deg);  animation-delay: -1s; opacity: .7; }
.b3 { left: 6%;  top: 70%; width: 28%; transform: rotate(-12deg); animation-delay: -2s; opacity: .8; }
.slab {
  position: absolute;
  left: 0; top: 18%;
  width: 6%; height: 56%;
  background: linear-gradient(90deg, #0c1d44, #12306b);
  border-right: 3px solid var(--cyan);
  box-shadow: 0 0 20px rgba(47,243,255,.6);
}
@keyframes beamPulse {
  0%, 100% { filter: brightness(.8); }
  50%      { filter: brightness(1.5); }
}

/* Top: overgrown ruins */
.jungle {
  clip-path: polygon(40% 0, 62% 0, 50% 52%);
  background:
    radial-gradient(ellipse at 50% 22%, rgba(170,230,150,.45), transparent 62%),
    linear-gradient(#335a37, #1a3624 60%, #0d1d16);
}
.pillar {
  position: absolute;
  top: 5%;
  width: 5%; height: 32%;
  background: linear-gradient(90deg, #56654f, #2c382d);
  border-radius: 6px 6px 0 0;
}
.pillar::after {
  content: '\16B1\A\16DF';        /* rune glyphs */
  white-space: pre;
  position: absolute;
  inset: 12% 0 auto 0;
  text-align: center;
  line-height: 1.8;
  color: var(--orange);
  text-shadow: 0 0 10px var(--orange);
  animation: runeGlow 2.4s ease-in-out infinite;
}
.p1 { left: 44%; }
.p2 { left: 52%; height: 26%; top: 9%; }
.p2::after { animation-delay: -1.2s; }
.vines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(100deg, rgba(60,140,60,.0) 0 14px, rgba(60,140,60,.22) 14px 18px);
}
@keyframes runeGlow {
  0%, 100% { opacity: .55; }
  50%      { opacity: 1; }
}

/* Upper right: crystal ice */
.crystal {
  clip-path: polygon(62% 0, 100% 0, 100% 45%, 50% 52%);
  background: linear-gradient(200deg, #d8c9ff 0%, #8a63e8 40%, #3a1f78 100%);
}
.crystal-shard {
  position: absolute;
  background: linear-gradient(160deg, #f1e9ff, #9a78ff 55%, #4d2aa6);
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  filter: drop-shadow(0 0 10px rgba(180,150,255,.8));
  animation: shardShimmer 4s ease-in-out infinite;
}
.c1 { left: 68%; top: 12%; width: 5%;  height: 20%; }
.c2 { left: 74%; top: 6%;  width: 7%;  height: 28%; animation-delay: -1s; }
.c3 { left: 82%; top: 14%; width: 5%;  height: 22%; animation-delay: -2s; }
.c4 { left: 90%; top: 4%;  width: 8%;  height: 32%; animation-delay: -3s; }
.c5 { left: 78%; top: 24%; width: 4%;  height: 14%; animation-delay: -.5s; }
@keyframes shardShimmer {
  0%, 100% { filter: drop-shadow(0 0 8px rgba(180,150,255,.6)) brightness(1); }
  50%      { filter: drop-shadow(0 0 18px rgba(255,255,255,.9)) brightness(1.3); }
}

/* Lower right: neon block city */
.city {
  clip-path: polygon(50% 52%, 100% 45%, 100% 100%, 36% 100%);
  background:
    repeating-linear-gradient(0deg, rgba(255,47,214,.16) 0 1px, transparent 1px 36px),
    repeating-linear-gradient(90deg, rgba(255,47,214,.16) 0 1px, transparent 1px 36px),
    linear-gradient(#22093f, #0f0520);
}
.block {
  position: absolute;
  bottom: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 14px, rgba(255,47,214,.5) 14px 18px) 0 0 / 100% 12px,
    #0b0614;
  border: 2px solid var(--magenta);
  box-shadow: 0 0 16px var(--magenta), inset 0 0 12px rgba(255,47,214,.35);
  animation: blockFlicker 5s steps(1) infinite;
}
.k1 { left: 56%; width: 7%;  height: 30%; }
.k2 { left: 64%; width: 9%;  height: 44%; animation-delay: -1.3s; }
.k3 { left: 74%; width: 8%;  height: 36%; animation-delay: -2.1s; }
.k4 { left: 83%; width: 10%; height: 56%; animation-delay: -3.4s; }
.k5 { left: 93%; width: 9%;  height: 40%; animation-delay: -.7s; }
@keyframes blockFlicker {
  0%, 92%, 100% { opacity: 1; }
  94% { opacity: .55; }
  96% { opacity: 1; }
  98% { opacity: .7; }
}

/* ---------- Effects layers ---------- */

#fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }

.vignette {
  position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: radial-gradient(ellipse at 50% 52%, transparent 40%, rgba(2,3,12,.75) 100%);
}
.scanlines {
  position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
.flash {
  position: absolute; inset: 0; z-index: 9; pointer-events: none;
  background: radial-gradient(circle at 50% 52%, #fff, var(--magenta) 40%, transparent 75%);
  opacity: 0;
}

/* Whole-screen glitch burst (class toggled by menu.js) */
#stage.glitching .realm {
  filter: hue-rotate(40deg) saturate(1.6) drop-shadow(4px 0 0 rgba(255,47,214,.7)) drop-shadow(-4px 0 0 rgba(47,243,255,.7));
  transform: translateX(var(--shift, 4px)) skewX(-1deg);
}
/* ---------- Title ---------- */

.title {
  position: absolute;
  z-index: 6;
  top: 7%;
  left: 50%;
  transform: translateX(-50%);
  width: 94%;
  text-align: center;
  font-weight: 900;
  font-size: clamp(1.9rem, 7vw, 5.6rem);
  letter-spacing: .12em;
  line-height: 1;
  color: #f4feff;
  text-shadow: 0 0 12px var(--cyan), 0 0 36px rgba(47,243,255,.55), 0 0 60px rgba(255,47,214,.35);
  animation: titleFloat 5s ease-in-out infinite, titleFlicker 7s steps(1) infinite;
}
.title::before, .title::after {
  content: attr(data-text);
  position: absolute; inset: 0;
  width: 100%;
  opacity: .85;
  pointer-events: none;
}
.title::before {
  color: var(--cyan);
  text-shadow: none;
  clip-path: inset(0 0 60% 0);
  animation: slice1 3.4s steps(1) infinite;
  mix-blend-mode: screen;
}
.title::after {
  color: var(--magenta);
  text-shadow: none;
  clip-path: inset(55% 0 0 0);
  animation: slice2 2.9s steps(1) infinite;
  mix-blend-mode: screen;
}
@keyframes titleFloat {
  0%, 100% { transform: translate(-50%, 0); }
  50%      { transform: translate(-50%, 8px); }
}
@keyframes titleFlicker {
  0%, 91%, 100% { opacity: 1; }
  92% { opacity: .6; }
  93% { opacity: 1; }
  95% { opacity: .75; }
}
@keyframes slice1 {
  0%, 82%, 100% { transform: translate(0); clip-path: inset(0 0 60% 0); }
  84% { transform: translate(-6px, 1px); clip-path: inset(10% 0 52% 0); }
  88% { transform: translate(5px, -1px); clip-path: inset(34% 0 30% 0); }
  92% { transform: translate(-3px, 0);  clip-path: inset(2% 0 78% 0); }
}
@keyframes slice2 {
  0%, 70%, 100% { transform: translate(0); clip-path: inset(55% 0 0 0); }
  72% { transform: translate(7px, 1px);  clip-path: inset(60% 0 14% 0); }
  78% { transform: translate(-6px, 0);   clip-path: inset(44% 0 36% 0); }
  86% { transform: translate(4px, -1px); clip-path: inset(78% 0 4% 0); }
}

/* ---------- Menu buttons ---------- */

.menu {
  position: absolute;
  z-index: 7;
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  width: min(960px, 94%);
}
.menu ul {
  list-style: none;
  display: flex;
  justify-content: center;
  gap: clamp(.6rem, 2vw, 1.4rem);
  flex-wrap: wrap;
}
.slot { filter: drop-shadow(0 0 8px var(--c)); transition: filter .2s, transform .2s; }
.slot:hover, .slot:focus-within {
  filter: drop-shadow(0 0 16px var(--c)) drop-shadow(0 0 30px var(--c));
  transform: translateY(-4px);
}

.btn {
  --cut: 12px;
  position: relative;
  min-width: clamp(130px, 18vw, 210px);
  padding: 1rem 1.6rem;
  border: 0;
  cursor: pointer;
  background: var(--c);
  color: #f4feff;
  font: 700 clamp(.85rem, 1.6vw, 1.1rem)/1 'Orbitron', system-ui, sans-serif;
  letter-spacing: .18em;
  clip-path: polygon(var(--cut) 0, 100% 0, calc(100% - var(--cut)) 100%, 0 100%);
  outline: none;
}
.btn::before {              /* dark fill leaves a 2px neon border */
  content: '';
  position: absolute; inset: 2px;
  background: linear-gradient(180deg, rgba(8,14,36,.92), rgba(5,8,22,.96));
  clip-path: polygon(calc(var(--cut) - 1px) 0, 100% 0, calc(100% - var(--cut) + 1px) 100%, 0 100%);
  transition: background .2s;
}
.btn:hover::before, .btn:focus-visible::before {
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #05081a), color-mix(in srgb, var(--c) 25%, #05081a));
}

.label { position: relative; z-index: 1; display: inline-block; }
.label::before, .label::after {
  content: attr(data-text);
  position: absolute; left: 0; top: 0;
  opacity: 0;
  pointer-events: none;
}
.label::before { color: var(--cyan);    }
.label::after  { color: var(--magenta); }
.btn:hover .label::before,  .btn:focus-visible .label::before  { opacity: .9; animation: btnGlitchA .45s steps(1) infinite; }
.btn:hover .label::after,   .btn:focus-visible .label::after   { opacity: .9; animation: btnGlitchB .45s steps(1) infinite; }
@keyframes btnGlitchA {
  0%   { transform: translate(-2px, 0);  clip-path: inset(0 0 55% 0); }
  33%  { transform: translate(2px, 1px); clip-path: inset(30% 0 20% 0); }
  66%  { transform: translate(-1px, 0);  clip-path: inset(60% 0 0 0); }
}
@keyframes btnGlitchB {
  0%   { transform: translate(2px, 0);   clip-path: inset(50% 0 0 0); }
  33%  { transform: translate(-2px, -1px); clip-path: inset(10% 0 55% 0); }
  66%  { transform: translate(1px, 0);   clip-path: inset(35% 0 30% 0); }
}
.btn:active { transform: scale(.97); }

/* ---------- Small screens ---------- */

@media (max-width: 640px) {
  .title { top: 6%; letter-spacing: .06em; }
  .menu { bottom: 4%; }
  .menu ul { display: grid; grid-template-columns: 1fr 1fr; }
  .btn { width: 100%; min-width: 0; padding: .95rem .6rem; letter-spacing: .1em; }
}

/* ---------- Respect reduced motion ---------- */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
  <main id="stage">

    <!-- Realms: each one is clipped to its own wedge; they all meet at the vortex -->
    <section class="realm cyber" aria-hidden="true">
      <div class="beam b1"></div>
      <div class="beam b2"></div>
      <div class="beam b3"></div>
      <div class="slab"></div>
    </section>

    <section class="realm jungle" aria-hidden="true">
      <div class="pillar p1"></div>
      <div class="pillar p2"></div>
      <div class="vines"></div>
    </section>

    <section class="realm crystal" aria-hidden="true">
      <div class="crystal-shard c1"></div>
      <div class="crystal-shard c2"></div>
      <div class="crystal-shard c3"></div>
      <div class="crystal-shard c4"></div>
      <div class="crystal-shard c5"></div>
    </section>

    <section class="realm city" aria-hidden="true">
      <div class="block k1"></div>
      <div class="block k2"></div>
      <div class="block k3"></div>
      <div class="block k4"></div>
      <div class="block k5"></div>
    </section>

    <!-- Vortex, rifts, debris, pixel glitches and screen tears are drawn here -->
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="vignette" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <h1 id="title" class="title" data-text="INTO THE NEXUS">INTO THE NEXUS</h1>

    <nav class="menu" aria-label="Main menu">
      <ul>
        <li class="slot" style="--c: var(--cyan)">
          <button class="btn" data-action="play"><span class="label" data-text="PLAY">PLAY</span></button>
        </li>
        <li class="slot" style="--c: var(--orange)">
          <button class="btn" data-action="shop"><span class="label" data-text="SHOP">SHOP</span></button>
        </li>
        <li class="slot" style="--c: var(--magenta)">
          <button class="btn" data-action="customize"><span class="label" data-text="CUSTOMIZE">CUSTOMIZE</span></button>
        </li>
        <li class="slot" style="--c: var(--violet)">
          <button class="btn" data-action="build"><span class="label" data-text="BUILD LEVEL">BUILD LEVEL</span></button>
        </li>
      </ul>
    </nav>

  </main>

  <script>
/* ============================================================
   INTO THE NEXUS - main menu logic
   - Canvas: spinning vortex, jagged rift lightning, drifting
     debris, pixel glitches and screen tears
   - Random glitch bursts across the whole screen
   - Button handlers: edit ACTIONS below to hook up your game
   ============================================================ */

(() => {
  'use strict';

  /* ---------- Menu routes ---------- */
  const ACTIONS = {
    play: () => window.location.assign('game.html?screen=levels'),
    shop: () => window.location.assign('game.html?screen=shop'),
    customize: () => window.location.assign('game.html?screen=customize'),
    build: () => window.location.assign('game.html?screen=maker'),
  };

  /* ---------- 2. Setup ---------- */
  const CX = 0.5, CY = 0.52;                       // vortex centre (fraction of screen)
  const stage  = document.getElementById('stage');
  const title  = document.getElementById('title');
  const canvas = document.getElementById('fx');
  const ctx    = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Rift lines run from the vortex to the edge of the screen: [x, y, colour]
  const RIFTS = [
    [0.40, 0.00, '#2ff3ff'],
    [0.62, 0.00, '#ff9a2f'],
    [1.00, 0.45, '#ff2fd6'],
    [0.36, 1.00, '#8a4dff'],
  ];

  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0;
  let debris = [], pixels = [], bolts = [];
    let glitchUntil = 0;
  let busy = false;

  const rand = (a, b) => a + Math.random() * (b - a);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W * CX;
    cy = H * CY;
    buildDebris();
    buildPixels();
    buildBolts();
  }

  /* ---------- 3. Debris (floating broken platforms) ---------- */
  function buildDebris() {
    const unit = Math.min(W, H);
    debris = Array.from({ length: 16 }, () => {
      const sides = Math.floor(rand(4, 7));
      const size = rand(0.018, 0.06) * unit;
      const pts = Array.from({ length: sides }, (_, i) => {
        const a = (i / sides) * Math.PI * 2;
        const r = size * rand(0.6, 1.1);
        return [Math.cos(a) * r, Math.sin(a) * r * 0.65];
      });
      return {
        pts,
        ang: rand(0, Math.PI * 2),
        dist: rand(0.16, 0.42) * unit,
        orbit: rand(0.04, 0.12) * (Math.random() < 0.5 ? -1 : 1),
        rot: rand(0, Math.PI * 2),
        spin: rand(-0.5, 0.5),
        bob: rand(0, Math.PI * 2),
        edge: ['#2ff3ff', '#ff2fd6', '#8a4dff'][Math.floor(rand(0, 3))],
      };
    });
  }

  function drawDebris(t, dt) {
    for (const d of debris) {
      d.ang += d.orbit * dt;
      d.rot += d.spin * dt;
      const x = cx + Math.cos(d.ang) * d.dist * 1.5;
      const y = cy + Math.sin(d.ang) * d.dist * 0.8 + Math.sin(t + d.bob) * 6;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(d.rot);
      ctx.beginPath();
      d.pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
      ctx.closePath();
      ctx.fillStyle = 'rgba(40,46,84,.92)';
      ctx.fill();
      ctx.strokeStyle = d.edge;
      ctx.lineWidth = 1.6;
      ctx.shadowColor = d.edge;
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- 4. Rift lightning ---------- */
  function makeBolt(x1, y1, x2, y2, jitter) {
    const segs = 16;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const nx = -dy / len, ny = dx / len;
    const pts = [[x1, y1]];
    for (let i = 1; i < segs; i++) {
      const f = i / segs;
      const off = rand(-jitter, jitter) * Math.sin(f * Math.PI);
      pts.push([x1 + dx * f + nx * off, y1 + dy * f + ny * off]);
    }
    pts.push([x2, y2]);
    return pts;
  }

  function buildBolts() {
    bolts = RIFTS.map(([fx, fy, color]) => ({
      color,
      pts: makeBolt(cx, cy, fx * W, fy * H, Math.min(W, H) * 0.035),
    }));
  }

  function drawBolts(t) {
    for (const b of bolts) {
      const flick = 0.65 + 0.35 * Math.sin(t * 18 + b.pts.length);
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.globalAlpha = flick;
      ctx.strokeStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 22;
      ctx.lineWidth = 4;
      strokePath(b.pts);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4;
      strokePath(b.pts);
      ctx.restore();
    }
  }

  function strokePath(pts) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
  }

  /* ---------- 5. Vortex ---------- */
  function drawVortex(t) {
    const base = Math.min(W, H) * 0.12;
    const R = base * (1 + 0.04 * Math.sin(t * 2.2));
    ctx.save();
    ctx.translate(cx, cy);

    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 2.4);
    glow.addColorStop(0, 'rgba(255,47,214,.55)');
    glow.addColorStop(0.5, 'rgba(47,243,255,.18)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, R * 2.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineCap = 'round';
    const arms = 6;
    for (let a = 0; a < arms; a++) {
      const color = a % 2 ? '#2ff3ff' : '#ff2fd6';
      ctx.beginPath();
      for (let r = 2; r <= R; r += 3) {
        const ang = (a / arms) * Math.PI * 2 + t * 1.6 - (r / R) * 5.2;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        r === 2 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.lineWidth = Math.max(3, R * 0.07);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- 6. Pixel glitches (left cyber realm) ---------- */
  function buildPixels() {
    pixels = Array.from({ length: 70 }, () => ({
      x: rand(0, W * 0.38),
      y: rand(H * 0.2, H * 0.8),
      s: rand(2, 7),
      v: rand(10, 40),
      life: rand(0, 1),
      color: Math.random() < 0.8 ? '#2ff3ff' : '#ff2fd6',
    }));
  }

  function drawPixels(dt) {
    for (const p of pixels) {
      p.x += p.v * dt;
      p.life += dt * rand(0.4, 1.6);
      if (p.x > W * 0.4 || p.life > 1) {
        p.x = rand(0, W * 0.2);
        p.y = rand(H * 0.2, H * 0.8);
        p.life = 0;
      }
      ctx.globalAlpha = Math.max(0, 1 - p.life) * 0.7;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.s * 2.4, p.s);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 7. Screen tear (horizontal slice displacement) ---------- */
  function tear() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const slices = Math.floor(rand(4, 8));
    for (let i = 0; i < slices; i++) {
      const sy = Math.floor(rand(0, canvas.height - 40));
      const sh = Math.floor(rand(6, 40) * dpr);
      const dx = Math.floor(rand(-40, 40) * dpr);
      ctx.drawImage(canvas, 0, sy, canvas.width, sh, dx, sy, canvas.width, sh);
    }
    ctx.restore();
  }

  /* ---------- 8. Glitch bursts ---------- */
  function glitchBurst() {
    const dur = rand(160, 320);
    stage.style.setProperty('--shift', `${rand(-9, 9).toFixed(1)}px`);
    stage.classList.add('glitching');
    glitchUntil = performance.now() + dur;
    setTimeout(() => stage.classList.remove('glitching'), dur);
    // Occasionally re-roll the lightning shape so the rifts "snap"
    buildBolts();
  }

  function scheduleGlitch() {
    setTimeout(() => {
      glitchBurst();
      if (Math.random() < 0.3) setTimeout(glitchBurst, 280);   // double-glitch
      scheduleGlitch();
    }, rand(2500, 6500));
  }

  /* ---------- 9. Main loop ---------- */
  let last = performance.now();
  let boltTimer = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;

    ctx.clearRect(0, 0, W, H);
    drawPixels(dt);
    drawDebris(t, dt);

    boltTimer += dt;
    if (boltTimer > 0.12) { boltTimer = 0; buildBolts(); }   // constant crackle
    drawBolts(t);
    drawVortex(t);

    if (now < glitchUntil) tear();
    requestAnimationFrame(frame);
  }

  /* ---------- Menu interaction ---------- */
  function go(action) {
    if (busy) return;
    busy = true;
    ACTIONS[action]?.();
  }

  const buttons = Array.from(document.querySelectorAll('.btn'));
  buttons.forEach((btn) => btn.addEventListener('click', () => go(btn.dataset.action)));

  document.addEventListener('keydown', (e) => {
    const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (!(e.key in keys)) return;
    e.preventDefault();
    const i = buttons.indexOf(document.activeElement);
    const next = i < 0 ? 0 : (i + keys[e.key] + buttons.length) % buttons.length;
    buttons[next].focus();
  });

  /* ---------- Start ---------- */
  window.addEventListener('resize', resize);
  resize();

  if (reduceMotion) {
    drawBolts(0);
    drawVortex(0);
  } else {
    requestAnimationFrame(frame);
    scheduleGlitch();
  }
})();

</script>
</body>
</html>
